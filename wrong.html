
  
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Սխալ պատասխան</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #200000, #650000, #000000);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 0 25px red;
            max-width: 500px;
        }

        h1 {
            color: #ff3333;
            font-size: 45px;
        }

        p {
            font-size: 22px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: gold;
            color: black;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.3s;
        }

        a:hover {
            background: orange;
            transform: scale(1.1);
        }

    </style>
</head>

<body>

    <div class="box">

        <h1>❌ ՍԽԱԼ ՊԱՏԱՍԽԱՆ</h1>

        <p>Վա՜յ, դու սխալվեցիր։</p>

        <p>
            Գանձը դեռ չի գտնվել։
            Փորձիր կրկին և մի հանձնվիր։
        </p>

        <h2>🗝️ Գանձը սպասում է քեզ։</h2>

        <a href="index.html">🔄 Վերադառնալ գլխավոր էջ</a>

    </div>

</body>
</html>
