
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Հաղթանակ</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b24, #123c36, #000000);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .victory {
            max-width: 600px;
            padding: 45px 30px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid gold;
            border-radius: 25px;
            box-shadow: 0 0 35px gold;
        }

        .treasure {
            font-size: 100px;
            margin: 15px;
        }

        h1 {
            color: gold;
            font-size: 48px;
            text-shadow: 0 0 20px orange;
        }

        h2 {
            color: #ffe680;
        }

        p {
            font-size: 21px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 16px 35px;
            background: linear-gradient(45deg, gold, orange);
            color: #171717;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            transition: 0.3s;
        }

        a:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px gold;
        }

        .stars {
            font-size: 30px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="victory">

        <div class="treasure">🏆💎</div>

        <h1>ԴՈՒ ՀԱՂԹԵՑԻՐ!</h1>

        <h2>🎉 ՇՆՈՐՀԱՎՈՐՈՒՄ ԵՆՔ 🎉</h2>

        <p>
            Դու հաջողությամբ լուծեցիր բոլոր 5 հանելուկները։
            Քո խելքը, տրամաբանությունն ու համբերությունը
            օգնեցին գտնել թաքնված գանձը։
        </p>

        <div class="treasure">💰🗝️</div>

        <h2>Դու իսկական գանձ որոնող ես։</h2>

        <p>
            Սա քո արկածի ավարտն է,
            բայց նոր գաղտնիքներ դեռ սպասում են քեզ։
        </p>

        <div class="stars">⭐ ⭐ ⭐ ⭐ ⭐</div>

        <a href="index.html">🔄 Կրկին խաղալ</a>

    </div>

</body>
</html>
